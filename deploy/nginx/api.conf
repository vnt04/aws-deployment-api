upstream aws_deployment_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Avatar tối đa 5MB, cộng thêm overhead của multipart.
    client_max_body_size 6M;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://aws_deployment_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location = /health {
        proxy_pass http://aws_deployment_api/health;
        access_log off;
    }
}

# Sau khi chạy `sudo certbot --nginx -d api.yourdomain.com`, certbot sẽ tự:
#   - thêm server block listen 443 ssl kèm đường dẫn certificate
#   - chuyển block :80 ở trên thành redirect 301 sang https
# Không cần sửa tay file này.
